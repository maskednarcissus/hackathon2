# Classroom Intelligence — full local stack (integration stage §7).
# GENERATED by `python tests/e2e/services.py --compose` — edit the service table there.
#
#   docker compose -f infrastructure/docker/docker-compose.full.yml up --build
#   python tests/e2e/run_e2e.py        # against the published localhost ports
#
# Fake STT/LLM providers; one Postgres database with every migration applied by `migrations`.
name: classroom-intelligence

x-common-env: &common-env
  DATABASE_URL: postgresql://ci:ci_dev@postgres:5432/classroom_intelligence
  EVENT_BUS_URL: http://dev-event-bus:8090
  IDENTITY_URL: http://identity:4001
  IDENTITY_SERVICE_URL: http://identity:4001
  ORGANIZATION_URL: http://organization:4002
  ORGANIZATION_SERVICE_URL: http://organization:4002
  ACADEMIC_INTEGRATION_URL: http://academic-integration:4003
  ACADEMIC_INTEGRATION_SERVICE_URL: http://academic-integration:4003
  DEVICE_MANAGEMENT_URL: http://device-management:4004
  CALENDAR_URL: http://calendar:4005
  NOTIFICATIONS_URL: http://notifications:4006
  TRANSCRIPT_MANAGEMENT_URL: http://transcript-management:4008
  TRANSCRIPT_MANAGEMENT_SERVICE_URL: http://transcript-management:4008
  ACADEMIC_ANALYTICS_URL: http://academic-analytics:4009
  GROUP_INTELLIGENCE_URL: http://group-intelligence:4010
  AUDIT_URL: http://audit:4011
  AUDIT_SERVICE_URL: http://audit:4011
  AUDIO_INGESTION_URL: http://audio-ingestion:8001
  AUDIO_PROCESSING_URL: http://audio-processing:8002
  TRANSCRIPTION_URL: http://transcription:8003
  SPEAKER_DIARIZATION_URL: http://speaker-diarization:8004
  AI_GATEWAY_URL: http://ai-gateway:8005
  LECTURE_INTELLIGENCE_URL: http://lecture-intelligence:8006
  EVENT_EXTRACTION_URL: http://event-extraction:8007
  IDENTITY_JWKS_URL: http://identity:4001/.well-known/jwks.json
  SYNC_TARGETS: identity=http://identity:4001,calendar=http://calendar:4005,notifications=http://notifications:4006,academic-analytics=http://academic-analytics:4009
  DSR_HANDLER_URLS: transcript-management=http://transcript-management:4008,lecture-intelligence=http://lecture-intelligence:8006,notifications=http://notifications:4006,calendar=http://calendar:4005,audit=http://audit:4011

x-service: &service
  env_file: [full-stack.env]
  restart: unless-stopped
  depends_on:
    migrations:
      condition: service_completed_successfully
    dev-event-bus:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci_dev
      POSTGRES_DB: classroom_intelligence
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ci -d classroom_intelligence']
      interval: 3s
      timeout: 3s
      retries: 20

  migrations:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ci
      PGPASSWORD: ci_dev
      PGDATABASE: classroom_intelligence
    volumes:
      - ../../data/migrations:/migrations:ro
      - ./apply-migrations.sh:/apply-migrations.sh:ro
    entrypoint: ['sh', '/apply-migrations.sh', '/migrations']

  dev-event-bus:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: infrastructure/dev-event-bus }
    env_file: [full-stack.env]
    environment:
      <<: *common-env
      PORT: '8090'
      SUBSCRIPTIONS_FILE: /events/subscriptions.yaml
      BUS_TIMEOUT_MS: '600000'
    ports: ['8090:8090']

  identity:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/identity }
    environment:
      <<: *common-env
      PORT: '4001'
    ports: ['4001:4001']

  organization:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/organization }
    environment:
      <<: *common-env
      PORT: '4002'
    ports: ['4002:4002']

  academic-integration:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/academic-integration }
    environment:
      <<: *common-env
      PORT: '4003'
    ports: ['4003:4003']

  device-management:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/device-management }
    environment:
      <<: *common-env
      PORT: '4004'
    ports: ['4004:4004']

  calendar:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/calendar }
    environment:
      <<: *common-env
      PORT: '4005'
    ports: ['4005:4005']

  notifications:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/notifications }
    environment:
      <<: *common-env
      PORT: '4006'
    ports: ['4006:4006']

  transcript-management:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/transcript-management }
    environment:
      <<: *common-env
      PORT: '4008'
    ports: ['4008:4008']

  academic-analytics:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/academic-analytics }
    environment:
      <<: *common-env
      PORT: '4009'
    ports: ['4009:4009']

  group-intelligence:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/group-intelligence }
    environment:
      <<: *common-env
      PORT: '4010'
      WAREHOUSE: postgres
    ports: ['4010:4010']

  audit:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args: { SERVICE_PATH: services/audit }
    environment:
      <<: *common-env
      PORT: '4011'
    ports: ['4011:4011']

  audio-ingestion:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.python
      args: { SERVICE_PATH: services/audio-ingestion }
    environment:
      <<: *common-env
      PORT: '8001'
      AUDIO_LOCAL_STORAGE_DIR: /data/audio
      UPLOAD_STAGING_DIR: /data/staging
    ports: ['8001:8001']
    volumes: [audio_data:/data]

  audio-processing:
    <<: *service
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.python
