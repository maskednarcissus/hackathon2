[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-agent"
version = "1.0.0"
description = "Classroom Intelligence — classroom capture device agent"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
pkcs11 = ["PyKCS11>=1.5"]
dev = [
    "pytest>=8.0.0",
    "ruff==0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
ci-agent = "ci_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
