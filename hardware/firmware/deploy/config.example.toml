# /etc/ci-agent/config.toml — every key can be overridden with CI_AGENT_<KEY> env vars.
[agent]
device_management_url = "https://devices.ci.example.com"
ingestion_url = "https://ingest.ci.example.com"
data_dir = "/var/lib/ci-agent"
serial_number = "CI-A1-000123"
model = "ci-capture-a1"
firmware_version = "1.0.0"
audio_device = "default"          # ALSA PCM name (arecord -L)
sample_rate = 16000
channels = 1
chunk_size_bytes = 4194304        # 4 MiB (max 16 MiB)
heartbeat_interval_s = 60
plan_refresh_interval_s = 300
plan_horizon_hours = 36
upload_interval_s = 30
uploaded_retention_hours = 24
spool_soft_limit_bytes = 21474836480   # 20 GiB: delete uploaded audio above this
spool_hard_limit_bytes = 30064771072   # 28 GiB: only then evict un-uploaded audio
max_clock_skew_s = 120
