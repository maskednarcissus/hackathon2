name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 1. Lint & format check (TypeScript/JS side)
  lint-ts:
    name: Lint & Format (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # 2. Type checking (TypeScript)
  typecheck-ts:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # 3. Unit tests (TypeScript)
  test-ts:
    name: Unit Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: typecheck-ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # 4. Lint & format check (Python)
  lint-python:
    name: Lint & Format (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - audio-ingestion
          - audio-processing
          - transcription
          - speaker-diarization
          - lecture-intelligence
          - event-extraction
          - ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.7.0
      - name: Ruff check — ${{ matrix.service }}
        run: ruff check services/${{ matrix.service }}/
      - name: Ruff format check — ${{ matrix.service }}
        run: ruff format --check services/${{ matrix.service }}/

  # 5. Type check (Python)
  typecheck-python:
    name: Type Check (Python)
    runs-on: ubuntu-latest
    needs: lint-python
    strategy:
      matrix:
        service:
          - audio-ingestion
          - audio-processing
          - transcription
          - speaker-diarization
          - lecture-intelligence
          - event-extraction
          - ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies — ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          pip install -e ".[dev]"
      - name: Mypy — ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          mypy src/

  # 6. Unit tests (Python)
  test-python:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    needs: typecheck-python
    strategy:
      matrix:
        service:
          - audio-ingestion
          - audio-processing
          - transcription
          - speaker-diarization
          - lecture-intelligence
          - event-extraction
          - ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies — ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          pip install -e ".[dev]"
      - name: pytest — ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          pytest tests/ -v --tb=short

  # 7. Build (TypeScript apps and services)
  build-ts:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    needs: [test-ts, test-python]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # 8. Schema validation
  validate-schemas:
    name: Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate Zod schemas compile
        run: pnpm --filter @ci/schemas typecheck

  # 9. Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
