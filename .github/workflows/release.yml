name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: classroom-intelligence

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service:
          - api
          - identity
          - organization
          - academic-integration
          - device-management
          - audio-ingestion
          - audio-processing
          - transcription
          - speaker-diarization
          - transcript-management
          - lecture-intelligence
          - event-extraction
          - calendar
          - notifications
          - academic-analytics
          - group-intelligence
          - ai-gateway
          - audit
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Extract tag version
        id: meta
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Determine service path
        id: path
        run: |
          if [ -d "apps/${{ matrix.service }}" ]; then
            echo "SERVICE_DIR=apps/${{ matrix.service }}" >> $GITHUB_OUTPUT
          else
            echo "SERVICE_DIR=services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}"
          docker build \
            -t "$IMAGE:${{ steps.meta.outputs.VERSION }}" \
            -t "$IMAGE:latest" \
            ${{ steps.path.outputs.SERVICE_DIR }}
          docker push "$IMAGE:${{ steps.meta.outputs.VERSION }}"
          docker push "$IMAGE:latest"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Deploy to Cloud Run (staging)
        run: |
          echo "Deploy step — configure with your Cloud Run service names"
          # gcloud run deploy ci-api --image ... --region southamerica-east1 --project $PROJECT_ID
